<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kermitakilla</title>

<style>

body{
margin:0;
background:black;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

video{
width:90%;
max-width:1000px;
height:auto;
display:block;
}

</style>
</head>

<body>

<video id="introVideo" autoplay muted playsinline>
<source src="IntroName.mp4" type="video/mp4">
</video>

<script>

const video = document.getElementById("introVideo");

// allow sound if user taps
document.body.addEventListener("click", () => {
video.muted = false;
});

// redirect when video finishes
video.onended = function(){
window.location.href = "home.html";
};

</script>

</body>
</html>
