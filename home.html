<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>Kermitakilla</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>

body{
  font-family:'Orbitron', sans-serif;
  color:#ccffcc;
  margin:0;
  text-align:center;
  background:
    radial-gradient(circle at 50% 20%, rgba(0,255,100,0.15), transparent 60%),
    radial-gradient(circle at 50% 80%, rgba(0,255,100,0.05), transparent 70%),
    #000;
}

img{max-width:100%;height:auto;}

header{
padding:20px 20px 60px;
background:linear-gradient(#001a00,#000);
border-bottom:2px solid #00ff66;
}

h1,h2,h3{font-family:'Cinzel', serif;letter-spacing:1px;}
h1,h2{text-shadow:0 0 5px #00ff66,0 0 10px #00ff66,0 0 20px rgba(0,255,102,0.5);}
h1{font-size:48px;margin-bottom:10px;}
h2{color:#00ff66;margin-top:40px;}

p{color:#aaffaa;max-width:800px;margin:auto;line-height:1.6;}

.hero{
  position:relative;
  max-width:1100px;
  margin:auto;
  padding:60px 0 80px;
}

/* VIDEO */
.bannerVideo{
  width:60%;
  max-width:750px;
  border-radius:12px;
  display:block;
  margin:0 auto;
  position:relative;
  z-index:2;
}

/* TOP FROG */
.frogTopBody{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  height:260px;
  z-index:1;
  pointer-events:none;
}

.frogTopHands{
  position:absolute;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  height:120px;
  z-index:3;
  pointer-events:none;
}

/* VIDEO SECTION */
.videoWrap{
  position:relative;
  display:inline-block;
}

.videoFrame{
  position:relative;
  z-index:2;
  border:2px solid #00ff66;
  border-radius:10px;
}

/* SIDE FROG */
.frogSideBody{
  position:absolute;
  right:-60px;
  top:50%;
  transform:translateY(-50%);
  height:320px;
  z-index:1;
  pointer-events:none;
}

.frogSideArm{
  position:absolute;
  right:120px;
  top:55%;
  transform:translateY(-50%);
  height:220px;
  z-index:3;
  pointer-events:none;
}

/* hover glow */
.videoFrame:hover{
  box-shadow:
    0 0 15px #00ff66,
    0 0 35px rgba(0,255,100,0.5);
}

.contentRow{
display:flex;
gap:30px;
justify-content:center;
flex-wrap:wrap;
margin-top:40px;
}

iframe{max-width:95%;border-radius:10px;}

.buttons a{
display:inline-block;
margin:10px;
padding:14px 26px;
background:#001a00;
border:2px solid #00ff66;
border-radius:8px;
color:#00ff66;
font-weight:bold;
text-decoration:none;
transition:.2s;
}

.buttons a:hover{background:#00ff66;color:#000;}

.store-btn{
display:flex;
justify-content:center;
align-items:center;
margin-top:20px;
}

.store-img{width:200px;}

.store-btn:hover .store-img{
content:url("images/ui/store/kermitakilla-store-hover.webp");
}

.store-btn:hover{transform:scale(1.05);}
.store-btn:active{transform:scale(0.95);}

.merchPreview a{display:inline-block;transition:.2s;}
.merchPreview a:hover{transform:scale(1.08);}

.merchPreview img{
width:120px;
border-radius:8px;
border:2px solid #00ff66;
}

.merchPreview a:hover img{
box-shadow:0 0 10px #00ff66,0 0 25px rgba(0,255,100,0.6);
}

@media (max-width:768px){
.bannerVideo{width:90%;}
.frogTopBody{height:200px;}
.frogTopHands{height:90px;}
.frogSideBody{display:none;}
.frogSideArm{display:none;}
.store-img{width:160px;}
}

</style>
</head>

<body>

<header>

<h1>Kermitakilla</h1>
<h3>Welcome to the Swamp</h3>

<p>
Streaming looter shooters, RPGs, battle royales, and seasonal grinds.
Join the squad and hunt rare loot.
</p>

<div class="hero">

<img src="images/frogs/frog-top-body.webp" class="frogTopBody">

<video autoplay muted loop playsinline class="bannerVideo">
<source src="images/bannerloop.mp4" type="video/mp4">
</video>

<img src="images/frogs/frog-top-hands.webp" class="frogTopHands">

</div>

</header>

<!-- STREAM -->
<div class="section contentRow">

<div>
<h2>Latest Stream</h2>
<iframe height="350"
src="https://www.youtube.com/embed/live_stream?channel=UCduyfl_JAmffIzpufoOj1OQ"
allowfullscreen></iframe>
</div>

<div>
<h2>Latest Upload</h2>

<div class="videoWrap">

<img src="images/frogs/frog-side-body.webp" class="frogSideBody">

<div id="latestVideo" class="videoFrame"></div>

<img src="images/frogs/frog-side-arm.webp" class="frogSideArm">

</div>

</div>

</div>

<!-- SOCIAL -->
<div class="section buttons">
<a href="https://youtube.com/@KeRMiTaKiLlA">YouTube</a>
<a href="https://twitch.tv/kermitakilla">Twitch</a>
<a href="https://discord.gg/C5XGb98qaj">Discord</a>
</div>

<!-- MERCH -->
<div class="section">

<h2>Official Kermitakilla Merch</h2>

<a href="https://streamlabs.com/jkermitriley/merch" target="_blank" class="store-btn">
<img src="images/ui/store/kermitakilla-store-main.webp" class="store-img">
</a>

<div class="merchPreview">
<a href="https://streamlabs.com/jkermitriley/merch" target="_blank">
<img src="images/hoodie.jpg">
</a>

<a href="https://streamlabs.com/jkermitriley/merch" target="_blank">
<img src="images/shirt.jpg">
</a>

<a href="https://streamlabs.com/jkermitriley/merch" target="_blank">
<img src="images/hat.jpg">
</a>
</div>

</div>

<script>
const channelID="UCduyfl_JAmffIzpufoOj1OQ";

fetch(`https://api.rss2json.com/v1/api.json?rss_url=https://www.youtube.com/feeds/videos.xml?channel_id=${channelID}`)
.then(res=>res.json())
.then(data=>{
const videoID = data.items[0].link.split("v=")[1];
document.getElementById("latestVideo").innerHTML =
`<iframe height="350" src="https://www.youtube.com/embed/${videoID}" allowfullscreen></iframe>`;
});
</script>

</body>
</html>
